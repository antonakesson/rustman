[package]
name = "rustman"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
# Clipboard and link opening are native-only; they're added back below.
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
glam = "0.34"
web-time = "1"
wgpu = "30"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37", features = ["clipboard", "links"] }
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

# The ray tracer runs on the GPU, but keep the host loop reasonably fast in debug builds.
[profile.dev]
opt-level = 1
